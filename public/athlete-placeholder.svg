<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" fill="none">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="0.55" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#070707"/>
    </linearGradient>
    <radialGradient id="rim" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Stylized athlete silhouette: head, shoulders, torso -->
  <g fill="url(#g)">
    <!-- head -->
    <ellipse cx="300" cy="170" rx="78" ry="92"/>
    <!-- neck -->
    <rect x="270" y="240" width="60" height="40" rx="14"/>
    <!-- shoulders / torso -->
    <path d="M120 420 C 160 320, 240 285, 300 285 C 360 285, 440 320, 480 420 L 500 800 L 100 800 Z"/>
    <!-- left arm hint -->
    <path d="M120 420 C 90 480, 75 560, 80 660 L 130 660 C 140 560, 160 490, 180 440 Z"/>
    <!-- right arm hint -->
    <path d="M480 420 C 510 480, 525 560, 520 660 L 470 660 C 460 560, 440 490, 420 440 Z"/>
  </g>
  <!-- rim light -->
  <ellipse cx="300" cy="170" rx="78" ry="92" fill="url(#rim)"/>
  <!-- placeholder label -->
  <text x="300" y="780" text-anchor="middle"
    font-family="ui-monospace, monospace" font-size="14"
    fill="#888" letter-spacing="3">[ ATHLETE PLACEHOLDER ]</text>
</svg>
